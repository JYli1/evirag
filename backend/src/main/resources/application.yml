# EviRAG 后端基础配置。
# 当前文件只保存环境变量占位和安全默认值，真实密钥、数据库密码、邮箱授权码必须放入 backend/.env。
server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: evirag
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rag_doc_qa}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:600000}
      keepalive-time: ${DB_POOL_KEEPALIVE_TIME_MS:300000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${MAIL_SSL:false}
  servlet:
    multipart:
      # Spring/Tomcat 会先解析 multipart 请求；默认单文件只有 1MB。
      # 这里必须和 evirag.max-file-size-mb 保持一致，否则请求还没进 DocumentService 就会被容器拦截。
      max-file-size: ${APP_MAX_FILE_SIZE_MB:20}MB
      max-request-size: ${APP_MAX_REQUEST_SIZE_MB:${APP_MAX_FILE_SIZE_MB:20}}MB

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html

evirag:
  upload-dir: ${APP_UPLOAD_DIR:./uploads}
  max-file-size-mb: ${APP_MAX_FILE_SIZE_MB:20}
  mail:
    from: ${MAIL_FROM:}
  jwt:
    secret: ${JWT_SECRET:change-me}
    expire-minutes: ${JWT_EXPIRE_MINUTES:1440}
  llm:
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:gpt-4o-mini}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:60}
  embedding:
    base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn/v1}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:}
    timeout-seconds: ${EMBEDDING_TIMEOUT_SECONDS:60}
  chroma:
    host: ${CHROMA_HOST:localhost}
    port: ${CHROMA_PORT:8000}
    tenant: ${CHROMA_TENANT:default_tenant}
    database: ${CHROMA_DATABASE:default_database}
    token: ${CHROMA_TOKEN:}
    collection-prefix: ${CHROMA_COLLECTION_PREFIX:rag_kb_}
  chunk:
    max-chars: ${CHUNK_MAX_CHARS:1200}
    overlap-chars: ${CHUNK_OVERLAP_CHARS:120}
  rag:
    top-k: ${RAG_TOP_K:5}
    low-score-threshold: ${RAG_LOW_SCORE_THRESHOLD:0.35}
    history-turns: ${RAG_HISTORY_TURNS:4}
  web-search:
    enabled: ${TAVILY_ENABLED:true}
    base-url: ${TAVILY_BASE_URL:https://api.tavily.com}
    api-key: ${TAVILY_API_KEY:}
    curl-executable: ${TAVILY_CURL_EXECUTABLE:curl}
    search-depth: ${TAVILY_SEARCH_DEPTH:basic}
    extract-depth: ${TAVILY_EXTRACT_DEPTH:basic}
    max-results: ${TAVILY_MAX_RESULTS:5}
    timeout-seconds: ${TAVILY_TIMEOUT_SECONDS:25}
    per-source-max-chars: ${TAVILY_PER_SOURCE_MAX_CHARS:1200}
    context-max-chars: ${TAVILY_CONTEXT_MAX_CHARS:6000}
